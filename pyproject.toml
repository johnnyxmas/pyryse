[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyryse"
version = "0.2.0"
description = "Local (no-cloud) async client for RYSE SmartShade via the RYSE SmartBridge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Johnny Xmas" }]
keywords = ["ryse", "smartshade", "smartbridge", "home-assistant", "blinds", "shades"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/johnnyxmas/pyryse"
Issues = "https://github.com/johnnyxmas/pyryse/issues"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # aioresponses 0.7.9 (latest, 2026-11) constructs aiohttp's ClientResponse
  # directly and breaks on aiohttp>=3.14's new required stream_writer kwarg.
  # This bound is test-only: pyryse's runtime code never constructs
  # ClientResponse itself, so it is unaffected and the production `aiohttp`
  # dependency stays unconstrained (Home Assistant pins its own aiohttp).
  "aioresponses>=0.7.6,<0.8",
  "aiohttp<3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["pyryse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
