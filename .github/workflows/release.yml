name: Release to PyPI

# Publishes via PyPI Trusted Publishing (OIDC). This generates and uploads
# PEP 740 digital attestations (provenance) automatically — no API token.
# Configure the trusted publisher once at:
#   https://pypi.org/manage/project/pyryse/settings/publishing/
#   Owner: johnnyxmas | Repo: pyryse | Workflow: release.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing + attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
